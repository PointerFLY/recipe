name: Deploy Chopsticks to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'chopsticks/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [master]
    paths:
      - 'chopsticks/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser adapter against Python rules and solver
        run: python -m unittest chopsticks.tests.test_web_game -v
      - name: Build static site
        run: python -m chopsticks.export_web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}chopsticks/
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
